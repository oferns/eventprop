[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eventprop"
version = "0.1"
description = "EventProp: Event-based backpropagation for Spiking Neural Networks (C library bindings via ctypes)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []  # No external dependencies — pure ctypes

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["eventprop*"]
