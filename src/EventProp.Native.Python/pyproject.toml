[build-system]
requires = ["setuptools>=64", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "eventprop-cffi"
version = "0.1"
description = "EventProp: Event-based backpropagation for Spiking Neural Networks (C library bindings via CFFI)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["eventprop_cffi*"]

[tool.setuptools.package-data]
eventprop_cffi = ["*.dylib", "*.so"]
